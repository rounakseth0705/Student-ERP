services:
  # 1. Backend Service (Node.js API)
  - type: web
    name: student-erp-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (SPA)
  - type: web
    name: student-erp-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL # Rename to REACT_APP_API_URL if using Create React App
        fromService:
          type: web
          name: student-erp-server
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html